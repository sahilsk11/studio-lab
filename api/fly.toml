app = "studio-lab"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3001"
  DATA_DIR = "/data"
  NODE_ENV = "production"
  CORS_ALLOWED_ORIGIN = "https://studiolab.ultron.sh"
  CLOUDFLARE_ACCESS_TEAM_DOMAIN = "https://sahilagentserver.cloudflareaccess.com"

[[mounts]]
  source = "studio_lab_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
